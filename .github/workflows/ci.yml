name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horaneo
          POSTGRES_PASSWORD: horaneo
          POSTGRES_DB: horaneo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horaneo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://horaneo:horaneo@localhost:5432/horaneo_test
      TEST_APP_DATABASE_URL: postgres://app_runtime:ci-runtime-password@localhost:5432/horaneo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
