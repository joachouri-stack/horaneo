# Base de données locale pour le développement (facultatif si PostgreSQL est déjà installé).
# Lancer : docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: horaneo
      POSTGRES_PASSWORD: horaneo
      POSTGRES_DB: horaneo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
